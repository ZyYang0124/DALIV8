<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Descanso</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1100px;  
    margin: auto;
    line-height: 1.5;
    color: #111;
    padding: 20px 0;
}

 
.header {
    border-bottom: 2px solid #000;
    margin-bottom: 20px;
    padding-bottom: 10px;
}

h1 {
    font-size: 22px;
    margin-bottom: 5px;
}

 
.species-card {
    margin-top: 30px;
    border: 1px solid #ddd;
    padding: 15px;
    background: #fff;
}

.species-title {
    font-size: 16px;
    font-weight: bold;
    border-left: 4px solid #000;
    padding-left: 8px;
    margin-bottom: 15px;
}

.species-title a {
    color: #000;
    text-decoration: none;
}

.species-title a:hover {
    text-decoration: underline;
}

 
.grid-10-columns {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr)); 
    gap: 8px;
}

.gallery-item {
    aspect-ratio: 4 / 3;  
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    border: 1px solid #eee;
    padding: 4px;
    overflow: hidden;
    font-size: 10px;
    text-align: center;
    flex-direction: column;
}

.gallery-item img {
    max-width: 100%;
    max-height: 80%;
    object-fit: contain;
    display: block;
}

.caption-sub {
    font-size: 9px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    margin-top: 2px;
}

.no-image-placeholder {
    color: #999;
    font-size: 13px;
    font-style: italic;
}
</style>
</head>

<body>

<div class="header">
