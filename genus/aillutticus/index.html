body {

}

}

}

    display: grid;

}

.gallery-item {
    aspect-ratio: 4 / 3;  
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    border: 1px solid #eee;
    padding: 4px;
    overflow: hidden;
    font-size: 10px;
    text-align: center;
    flex-direction: column;
}

.gallery-item img {
    max-width: 100%;
    max-height: 80%;
    object-fit: contain;
    display: block;
}

.caption-sub {
    font-size: 9px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    margin-top: 2px;
}

.no-image-placeholder {
    color: #999;
    font-size: 13px;
    font-style: italic;
}
</style>
